[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "silentml"
version = "0.1.0"
description = "Dataset loading, training and Core ML export for Tacit Type silent commands"
requires-python = ">=3.11"
dependencies = ["numpy>=1.26"]

[project.optional-dependencies]
dev = ["pytest>=8"]
# Needed from M5. torch and coremltools may lag the newest Python release.
train = ["torch>=2.3", "coremltools>=8"]

[tool.setuptools]
packages = ["silentml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
