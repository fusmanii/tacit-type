[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "silentml"
version = "0.1.0"
description = "Dataset loading and lip-reading fine-tuning for Tacit Type silent dictation"
requires-python = ">=3.11"
dependencies = ["numpy>=1.26", "av>=12"]

[project.optional-dependencies]
dev = ["pytest>=8"]
# Needed from M5 for fine-tuning and the sidecar. torch may lag the newest Python release.
train = ["torch>=2.3"]

[tool.setuptools]
packages = ["silentml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
