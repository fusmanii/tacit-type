[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "silentml"
version = "0.1.0"
description = "Dataset loading and lip-reading fine-tuning for Tacit Type silent dictation"
requires-python = ">=3.11"
dependencies = ["numpy>=1.26", "av>=12"]

[project.optional-dependencies]
dev = ["pytest>=8"]
# The lip-reading models in third_party (git submodules) and the tools around them.
# setuptools provides distutils, which USR 2.0's ESPnet copy still imports.
models = [
    "torch>=2.9",
    "torchvision>=0.24",
    "torchaudio>=2.9",
    "opencv-python-headless>=4.10",
    "scikit-image>=0.24",
    "sentencepiece>=0.2",
    "omegaconf>=2.3",
    "six",
    "setuptools",
    "gdown>=5",
]

[tool.setuptools]
packages = ["silentml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
