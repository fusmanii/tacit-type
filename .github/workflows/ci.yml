name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  swift:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: TacitKit tests
        run: make test-swift
      - name: Build Tacit Type (macOS)
        run: make build-mac
      - name: Build Tacit Type (iOS)
        run: make build-ios

  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e 'ml[dev]'
      - run: pytest
        working-directory: ml
